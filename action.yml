name: 'Ultimate Go CI Suite'
description: 'Enterprise Go CI: parallelized checks (lint, modernize, vulncheck, tests), coverage gates, and aggressive caching.'
author: 'alesr'
branding:
  icon: 'zap'
  color: 'blue'

inputs:
  working-directory:
    description: 'Relative path to the Go module directory'
    required: false
    default: '.'

  go-version-file:
    description: 'Path to go.mod or go.work file'
    required: false
    default: 'go.mod'

  go-version:
    description: 'Explicit Go version (e.g., 1.26). Overrides go-version-file when set.'
    required: false
    default: ''

  cache-dependency-path:
    description: 'File path pattern for caching go.sum / go.work.sum'
    required: false
    default: '**/go.sum'

  # modernize
  run-modernize:
    description: 'Run gomodernize check'
    required: false
    default: 'true'

  # linting
  run-lint:
    description: 'Run golangci-lint'
    required: false
    default: 'true'
  lint-timeout:
    description: 'Timeout for golangci-lint execution (e.g., 5m)'
    required: false
    default: '5m'
  lint-concurrency:
    description: 'Number of parallel threads for golangci-lint (0 = auto/max cores)'
    required: false
    default: '0'

  # testing & coverage
  run-tests:
    description: 'Run go test'
    required: false
    default: 'true'
  race-detector:
    description: 'Enable -race flag during tests'
    required: false
    default: 'true'
  test-timeout:
    description: 'Timeout for go test execution'
    required: false
    default: '10m'
  test-parallel:
    description: 'Number of parallel test executions (go test -parallel)'
    required: false
    default: ''
  min-coverage:
    description: 'Minimum coverage percentage required to pass (0 to disable gate)'
    required: false
    default: '0'

  # security & modules
  run-vulncheck:
    description: 'Run govulncheck security scan'
    required: false
    default: 'true'
  vulncheck-timeout:
    description: 'Timeout for govulncheck execution'
    required: false
    default: '3m'
  verify-tidy:
    description: 'Verify go.mod and go.sum are tidy'
    required: false
    default: 'true'

outputs:
  test-coverage-file:
    description: 'Path to generated coverage profile'
    value: ${{ steps.test.outputs.coverage-file }}
  test-coverage-percent:
    description: 'Total code coverage percentage (e.g., 84.5%)'
    value: ${{ steps.test.outputs.coverage-percent }}

runs:
  using: 'composite'
  steps:
    # 1. validation & path resolution
    - name: Validate and Resolve Paths
      id: paths
      shell: bash
      run: |
        WD="${{ inputs.working-directory }}"
        GVF="${{ inputs.go-version-file }}"
        CDP="${{ inputs.cache-dependency-path }}"

        # Normalize working-directory (remove trailing slashes)
        WD="${WD%/}"
        [ -z "$WD" ] && WD="."

        # Resolve go-version-file: if it's just a filename, prepend working-directory
        if [[ "$GVF" != /* ]]; then
          GVF_FILE="${GVF##*/}"
          if [[ "$WD" != "." && ! "$GVF" =~ ^$WD ]]; then
            RESOLVED_GVF="${WD}/${GVF_FILE}"
          else
            RESOLVED_GVF="$GVF"
          fi
        else
          RESOLVED_GVF="$GVF"
        fi

        # Validate the resolved path exists
        if [ ! -f "$RESOLVED_GVF" ]; then
          echo "::error::go.mod/go.work file not found at: $RESOLVED_GVF"
          echo "Expected location based on:"
          echo "  working-directory: $WD"
          echo "  go-version-file: $GVF"
          exit 1
        fi

        # Resolve cache-dependency-path for subdirectories
        if [[ "$WD" != "." && "$CDP" == "**/go.sum" ]]; then
          RESOLVED_CDP="${WD}/go.sum"
        else
          RESOLVED_CDP="$CDP"
        fi

        echo "working-directory=${WD}" >> $GITHUB_OUTPUT
        echo "go-version-file=${RESOLVED_GVF}" >> $GITHUB_OUTPUT
        echo "cache-dependency-path=${RESOLVED_CDP}" >> $GITHUB_OUTPUT

        echo "✓ Path resolution successful"
        echo "  working-directory: ${WD}"
        echo "  go-version-file: ${RESOLVED_GVF}"
        echo "  cache-dependency-path: ${RESOLVED_CDP}"

    # 2. Go toolchain (module + build cache)
    - name: Set up Go toolchain (explicit version)
      if: ${{ inputs.go-version != '' }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: true
        cache-dependency-path: ${{ steps.paths.outputs.cache-dependency-path }}

    - name: Set up Go toolchain (from go.mod)
      if: ${{ inputs.go-version == '' }}
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ steps.paths.outputs.go-version-file }}
        cache: true
        cache-dependency-path: ${{ steps.paths.outputs.cache-dependency-path }}

    # 3. CI tool binaries + lint analysis cache.
    # Tool versions are pinned and bumped deliberately with action releases;
    # when bumping, update the key below so stale binaries are evicted.
    - name: Restore CI Tool Cache
      id: tool-cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ runner.temp }}/uci-tools
          ~/.cache/golangci-lint
        key: ${{ runner.os }}-${{ runner.arch }}-uci-tools-gcl2.12.2-mod0.50.0-gv1.8.0

    # 4. install tools (skipped per-tool on cache hit; installs run concurrently)
    - name: Install CI Tools
      shell: bash
      env:
        TOOL_BIN: ${{ runner.temp }}/uci-tools
      run: |
        set -e
        mkdir -p "${TOOL_BIN}"
        echo "${TOOL_BIN}" >> "${GITHUB_PATH}"

        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)  GCL_PKG="linux-amd64" ;;
          Linux-aarch64) GCL_PKG="linux-arm64" ;;
          Darwin-x86_64) GCL_PKG="darwin-amd64" ;;
          Darwin-arm64)  GCL_PKG="darwin-arm64" ;;
          *) echo "::error::unsupported platform $(uname -s)-$(uname -m)"; exit 1 ;;
        esac

        install_golangci() {
          if [ -x "${TOOL_BIN}/golangci-lint" ]; then return 0; fi
          echo "::group::Install golangci-lint v2.12.2"
          TARBALL="golangci-lint-2.12.2-${GCL_PKG}.tar.gz"
          curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/v2.12.2/${TARBALL}" -o "/tmp/${TARBALL}"
          tar -xzf "/tmp/${TARBALL}" -C /tmp
          cp "/tmp/golangci-lint-2.12.2-${GCL_PKG}/golangci-lint" "${TOOL_BIN}/golangci-lint"
          chmod +x "${TOOL_BIN}/golangci-lint"
          rm -rf "/tmp/${TARBALL}" "/tmp/golangci-lint-2.12.2-${GCL_PKG}"
          echo "::endgroup::"
        }

        install_modernize() {
          if [ -x "${TOOL_BIN}/modernize" ]; then return 0; fi
          echo "::group::Install modernize v0.50.0"
          # GOTOOLCHAIN=auto: building the tool needs go >= 1.26 regardless of
          # the toolchain selected for the target module (setup-go exports
          # GOTOOLCHAIN=local, which would otherwise refuse the download).
          GOTOOLCHAIN=auto GOBIN="${TOOL_BIN}" go install golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@v0.50.0
          echo "::endgroup::"
        }

        install_govulncheck() {
          if [ -x "${TOOL_BIN}/govulncheck" ]; then return 0; fi
          echo "::group::Install govulncheck v1.8.0"
          GOTOOLCHAIN=auto GOBIN="${TOOL_BIN}" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          echo "::endgroup::"
        }

        install_golangci & install_modernize & install_govulncheck & wait

        command -v golangci-lint modernize govulncheck

    # 5. parallel checks: tidy, modernize, lint, vulncheck and tests run
    #    concurrently; logs are captured per-check and replayed in order.
    - name: Run All Checks (Parallel)
      id: test
      shell: bash
      run: |
        # The runner invokes scripts with -e; disable it — this step aggregates
        # per-check exit codes itself and must never abort mid-flight.
        set +e

        WORK="${{ steps.paths.outputs.working-directory }}"
        LOGS="$(mktemp -d)"
        SUMMARY_MD="${LOGS}/summary.md"
        PREFIX=""
        [ "${WORK}" != "." ] && PREFIX="${WORK}/"

        echo "::add-matcher::${{ github.action_path }}/.github/golangci-lint-matcher.json"

        # ---------------- check definitions ----------------
        check_tidy() {
          cd "${WORK}" || return 97
          OUT="$(go mod tidy -diff 2>&1)"
          if [ $? -ne 0 ]; then
            echo "${OUT}"
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy' locally and commit the result."
            return 1
          fi
          echo "go.mod and go.sum are tidy."
        }

        check_modernize() {
          cd "${WORK}" || return 97
          command -v modernize >/dev/null 2>&1 || { echo "modernize binary not found on PATH"; return 97; }
          go_ver="$(awk '/^[[:space:]]*go[[:space:]]+[0-9]/{print $2; exit}' go.mod)"
          [ -n "${go_ver}" ] || { echo "could not determine Go version from go.mod"; return 97; }

          ver_key() { printf '%s' "$1" | awk -F'[.v]' '{printf "%d%02d%02d\n", $1, $2+0, $3+0}'; }
          target="$(ver_key "${go_ver}")"

          # Analyzer gates: "<flag>:<minimum Go version>". Tracks the newest
          # analyzers; flags unknown to the pinned binary are filtered below.
          version_gates="
          any:1.18
          atomictypes:1.19
          stringscut:1.18
          stringscutprefix:1.20
          minmax:1.21
          slicesclip:1.21
          slicescontains:1.21
          slicesdelete:1.21
          slicessort:1.21
          appendclipped:1.21
          rangeint:1.22
          forvar:1.22
          reflecttypefor:1.22
          mapsloop:1.23
          slicesbackward:1.23
          stditerators:1.23
          omitzero:1.24
          bloop:1.24
          stringsseq:1.24
          testingcontext:1.24
          waitgroupgo:1.25
          reflecttypeassert:1.25
          errorsastype:1.26
          newexpr:1.26
          embedlit:1.27
          "

          suppress=""
          supported_flags="$(modernize -h 2>&1 || true)"
          for gate in ${version_gates}; do
            name="${gate%%:*}"
            min="${gate##*:}"
            if [ "${target}" -lt "$(ver_key "${min}")" ]; then
              if printf '%s\n' "${supported_flags}" | grep -qE "^  -${name}\$"; then
                suppress="${suppress} -${name}=false"
              fi
            fi
          done

          echo "target Go version: ${go_ver}"
          [ -z "${suppress}" ] || echo "suppressed analyzers:${suppress}"

          modernize ${suppress} ./...
          rc=$?
          if [ "${rc}" -ne 0 ]; then
            # Surface the would-be changes without touching the working tree.
            tmpdir="$(mktemp -d)"
            cp -a . "${tmpdir}/src"
            (cd "${tmpdir}/src" && modernize ${suppress} -fix ./... >/dev/null 2>&1) || true
            echo "Proposed modernization changes:"
            diff -ruN --exclude=.git --exclude=coverage.out . "${tmpdir}/src" || true
            rm -rf "${tmpdir}"
            echo "Un-modernized code found. Apply the diff above or run 'modernize -fix ./...' locally."
            return 1
          fi
        }

        check_lint() {
          cd "${WORK}" || return 97
          command -v golangci-lint >/dev/null 2>&1 || { echo "golangci-lint binary not found on PATH"; return 97; }
          ARGS="run --timeout=${{ inputs.lint-timeout }}"
          if [ "${{ inputs.lint-concurrency }}" != "0" ]; then
            ARGS="${ARGS} --concurrency=${{ inputs.lint-concurrency }}"
          fi
          golangci-lint ${ARGS} ./...
        }

        check_vulncheck() {
          cd "${WORK}" || return 97
          command -v govulncheck >/dev/null 2>&1 || { echo "govulncheck binary not found on PATH"; return 97; }
          timeout "${{ inputs.vulncheck-timeout }}" govulncheck ./...
        }

        check_tests() {
          cd "${WORK}" || return 97
          RACE=""
          if [ "${{ inputs.race-detector }}" = "true" ]; then RACE="-race"; fi
          PAR=""
          if [ -n "${{ inputs.test-parallel }}" ]; then PAR="-parallel=${{ inputs.test-parallel }}"; fi
          go test -v ${RACE} ${PAR} -timeout=${{ inputs.test-timeout }} -coverprofile=coverage.out -covermode=atomic ./...
        }

        # ---------------- launch concurrently ----------------
        if [ "${{ inputs.verify-tidy }}" = "true" ]; then check_tidy >"${LOGS}/tidy.log" 2>&1; echo $? >"${LOGS}/tidy.status"; fi &
        if [ "${{ inputs.run-modernize }}" = "true" ]; then check_modernize >"${LOGS}/modernize.log" 2>&1; echo $? >"${LOGS}/modernize.status"; fi &
        if [ "${{ inputs.run-lint }}" = "true" ]; then check_lint >"${LOGS}/lint.log" 2>&1; echo $? >"${LOGS}/lint.status"; fi &
        if [ "${{ inputs.run-vulncheck }}" = "true" ]; then check_vulncheck >"${LOGS}/vulncheck.log" 2>&1; echo $? >"${LOGS}/vulncheck.status"; fi &
        if [ "${{ inputs.run-tests }}" = "true" ]; then check_tests >"${LOGS}/tests.log" 2>&1; echo $? >"${LOGS}/tests.status"; fi &
        wait

        # ---------------- replay in fixed order ----------------
        FAILED=""

        # Rewrite file paths in tool output to workspace-relative form so the
        # problem matcher annotates the right files. Handles three shapes:
        # absolute paths under the workspace (stripped), module-relative paths
        # like "main.go" (prefixed with working-directory), and paths that are
        # already workspace-relative (left alone).
        normalize_paths() {
          while IFS= read -r line; do
            if [[ "$line" =~ ^([^[:space:]]+\.go):([0-9]+):([0-9]+): ]]; then
              p="${BASH_REMATCH[1]}"
              rest="${line#"${p}"}"
              if [[ "$p" == "${GITHUB_WORKSPACE}/"* ]]; then
                echo "${p#"${GITHUB_WORKSPACE}"/}${rest}"
              elif [[ "$p" == /* ]]; then
                echo "${line}"
              elif [ -f "${WORK}/${p}" ]; then
                echo "${PREFIX}${p}${rest}"
              else
                echo "${line}"
              fi
            else
              echo "${line}"
            fi
          done < "$1"
        }

        replay() {
          name="$1"; title="$2"
          [ -f "${LOGS}/${name}.status" ] || return 0
          rc="$(cat "${LOGS}/${name}.status")"
          echo "::group::${title}"
          if [ "${name}" = "lint" ] || [ "${name}" = "modernize" ]; then
            normalize_paths "${LOGS}/${name}.log"
          else
            cat "${LOGS}/${name}.log"
          fi
          echo "::endgroup::"
          if [ "${rc}" -eq 0 ]; then
            echo "✅ ${title}"
            echo "| ${title} | ✅ |" >> "${SUMMARY_MD}"
          else
            echo "::error::${title} failed (exit ${rc})"
            echo "| ${title} | ❌ (exit ${rc}) |" >> "${SUMMARY_MD}"
            FAILED="1"
          fi
        }

        replay tidy "go mod tidy"
        replay modernize "gomodernize"
        replay lint "golangci-lint"
        replay vulncheck "govulncheck"
        replay tests "go test"

        # ---------------- coverage & gate ----------------
        TOTAL_COV=""
        GATE=""
        if [ "${{ inputs.run-tests }}" = "true" ] && [ -f "${WORK}/coverage.out" ]; then
          TOTAL_COV=$(cd "${WORK}" && go tool cover -func=coverage.out | grep total: | awk '{print $3}')
          if [ -n "${TOTAL_COV}" ]; then
            echo "coverage-file=coverage.out" >> "$GITHUB_OUTPUT"
            echo "coverage-percent=${TOTAL_COV}" >> "$GITHUB_OUTPUT"
            COV_NUM=$(echo "${TOTAL_COV}" | sed 's/%//')
            MIN_COV="${{ inputs.min-coverage }}"
            if [ "${MIN_COV}" -gt 0 ] 2>/dev/null; then
              PASS=$(awk -v cov="${COV_NUM}" -v min="${MIN_COV}" 'BEGIN {print (cov >= min) ? "1" : "0"}')
              if [ "${PASS}" -eq 0 ]; then
                echo "::error::Code coverage (${TOTAL_COV}) is below the required threshold of ${MIN_COV}%."
                GATE="❌ below ${MIN_COV}% gate"
                FAILED="1"
              else
                GATE="✅ gate ${MIN_COV}%"
              fi
            fi
          fi
        fi

        # ---------------- step summary ----------------
        {
          echo "### ⚡ Ultimate Go CI"
          echo ""
          echo "| Check | Result |"
          echo "|-------|--------|"
          [ -f "${SUMMARY_MD}" ] && cat "${SUMMARY_MD}"
          if [ -n "${TOTAL_COV}" ]; then
            echo "| Coverage | ${TOTAL_COV} ${GATE} |"
          fi
        } >> "${GITHUB_STEP_SUMMARY}"

        echo "::remove-matcher::"

        if [ -n "${FAILED}" ]; then
          echo "One or more checks failed."
          exit 1
        fi
        echo "All checks passed."

    # 6. coverage artifact upload
    - name: Upload Coverage Report
      if: ${{ always() && inputs.run-tests == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report-${{ github.run_id }}-${{ strategy.job-index }}
        path: ${{ steps.paths.outputs.working-directory }}/coverage.out
        retention-days: 30
