name: Self-Test Action

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Test subdirectory support (monorepo scenario)
  test-subdirectory:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.26']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Test Ultimate CI with subdirectory (Go ${{ matrix.go-version }})
        uses: ./
        with:
          working-directory: 'testdata'
          go-version-file: 'go.mod'
          run-modernize: 'true'
          run-tests: 'true'
          run-lint: 'true'
          run-vulncheck: 'true'
          verify-tidy: 'true'
          min-coverage: '60'
          race-detector: 'true'

  # Test with strict coverage gate
  test-coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Test with Strict 75% Coverage Gate
        uses: ./
        with:
          working-directory: 'testdata'
          go-version-file: 'go.mod'
          run-tests: 'true'
          min-coverage: '75'

  # Test minimal configuration (fast mode)
  test-minimal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Test Minimal Configuration (linting disabled)
        uses: ./
        with:
          working-directory: 'testdata'
          go-version-file: 'go.mod'
          run-lint: 'false'
          run-modernize: 'false'
          run-vulncheck: 'false'
          run-tests: 'true'
          min-coverage: '0'
