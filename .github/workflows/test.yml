name: Self-Test Action

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Test subdirectory support (monorepo scenario) across Go versions.
  # All matrix versions support go mod tidy -diff (available since Go 1.23),
  # so this matrix covers version compatibility, not a fallback path.
  test-subdirectory:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23', '1.26', '1.27']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test Ultimate CI with subdirectory (Go ${{ matrix.go-version }})
        uses: ./
        with:
          working-directory: 'testdata'
          go-version-file: 'go.mod'
          go-version: ${{ matrix.go-version }}
          run-modernize: 'true'
          run-tests: 'true'
          run-lint: 'true'
          run-vulncheck: 'true'
          verify-tidy: 'true'
          min-coverage: '60'
          race-detector: 'true'

  # Test with strict coverage gate
  test-coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test with Strict 75% Coverage Gate
        uses: ./
        with:
          working-directory: 'testdata'
          go-version-file: 'go.mod'
          run-tests: 'true'
          min-coverage: '75'

  # Test with action's lint config
  test-lint-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test with Action's Lint Configuration
        uses: ./
        with:
          working-directory: 'testdata'
          go-version-file: 'go.mod'
          run-lint: 'true'
          lint-config: '.golangci.yml'
          run-tests: 'false'
          run-modernize: 'false'
          run-vulncheck: 'false'

  # Test minimal configuration (fast mode)
  test-minimal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test Minimal Configuration (linting disabled)
        uses: ./
        with:
          working-directory: 'testdata'
          go-version-file: 'go.mod'
          run-lint: 'false'
          run-modernize: 'false'
          run-vulncheck: 'false'
          run-tests: 'true'
          min-coverage: '0'

  # Negative tests: prove the action actually gates bad input. Each step runs
  # the action against a deliberately broken fixture with continue-on-error,
  # then a follow-up step asserts the action FAILED. If the action ever
  # passes on broken input, the assert step fails the job.
  test-negative:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Untidy module must fail
        id: untidy
        continue-on-error: true
        uses: ./
        with:
          working-directory: 'testdata-negative/untidy'
          go-version-file: 'go.mod'
          run-modernize: 'false'
          run-lint: 'false'
          run-vulncheck: 'false'
          run-tests: 'false'
          verify-tidy: 'true'

      - name: Assert untidy module failed
        run: |
          if [ "${{ steps.untidy.outcome }}" != "failure" ]; then
            echo "::error::Expected the action to fail on an untidy module, outcome was '${{ steps.untidy.outcome }}'"
            exit 1
          fi
          echo "Action correctly failed on untidy module."

      - name: Lint error must fail
        id: lint
        continue-on-error: true
        uses: ./
        with:
          working-directory: 'testdata-negative/lint'
          go-version-file: 'go.mod'
          run-modernize: 'false'
          run-lint: 'true'
          run-vulncheck: 'false'
          run-tests: 'false'
          verify-tidy: 'false'

      - name: Assert lint error failed
        run: |
          if [ "${{ steps.lint.outcome }}" != "failure" ]; then
            echo "::error::Expected the action to fail on a lint error, outcome was '${{ steps.lint.outcome }}'"
            exit 1
          fi
          echo "Action correctly failed on lint error."

      - name: Low coverage must fail the gate
        id: coverage
        continue-on-error: true
        uses: ./
        with:
          working-directory: 'testdata-negative/coverage'
          go-version-file: 'go.mod'
          run-modernize: 'false'
          run-lint: 'false'
          run-vulncheck: 'false'
          run-tests: 'true'
          min-coverage: '90'
          verify-tidy: 'false'

      - name: Assert coverage gate failed
        run: |
          if [ "${{ steps.coverage.outcome }}" != "failure" ]; then
            echo "::error::Expected the action to fail below the 90% coverage gate, outcome was '${{ steps.coverage.outcome }}'"
            exit 1
          fi
          echo "Action correctly failed below the coverage gate."

      - name: Reachable vulnerability must fail
        id: vuln
        continue-on-error: true
        uses: ./
        with:
          working-directory: 'testdata-negative/vuln'
          go-version-file: 'go.mod'
          run-modernize: 'false'
          run-lint: 'false'
          run-vulncheck: 'true'
          run-tests: 'false'
          verify-tidy: 'false'

      - name: Assert vulnerability scan failed
        run: |
          if [ "${{ steps.vuln.outcome }}" != "failure" ]; then
            echo "::error::Expected the action to fail on a reachable vulnerability, outcome was '${{ steps.vuln.outcome }}'"
            exit 1
          fi
          echo "Action correctly failed on reachable vulnerability."
