# golangci-lint v2 configuration for Ultimate Go CI Suite
# Strict but realistic linting rules for production Go projects
# Docs: https://golangci-lint.run/docs/configuration/file/

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Error Checking
    - errcheck              # unchecked errors
    - errorlint             # error wrapping best practices
    - nilnil                # comparing explicitly nil values

    # Code Style
    - unused                # unused variables/functions
    - ineffassign           # ineffective assignments
    - misspell              # spelling mistakes in comments

    # Performance
    - prealloc              # pre-allocate slices
    - unconvert             # unnecessary type conversions

    # Best Practices
    - nolintlint            # poorly formed nolint directives
    - revive                # replacement for golint

    # Security
    - gosec                 # security issues

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: duplicated-imports
        - name: errorf
        - name: error-naming
        - name: error-strings
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming

    gosec:
      severity: medium
      confidence: medium

  exclusions:
    generated: lax
    warn-unused: false
    rules:
      # Ignore "missing comments" on exported symbols in test files
      - path: "_test\\.go$"
        linters:
          - revive

formatters:
  enable:
    - gofmt                 # code formatting
    - goimports             # import sorting and formatting
  settings:
    goimports:
      local-prefixes:
        - github.com/alesr
  exclusions:
    generated: lax
    paths:
      - vendor
      - .git
